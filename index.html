function an(shop){
const per=S.per,lim=per?Date.now()-per*864e5:0,os=O.filter(o=>o.ts>=lim&&(!shop||o.items.some(i=>i.s===shop))),ok=os.filter(o=>o.st!=='Отменён');
const K={n:ok.length,x:os.length-ok.length,q:0,rev:0,com:0},wd=Array(7).fill(0),hr=Array(24).fill(0),top={},bs={},pay={cash:0,card:0},nd=per||14,dv=Array(nd).fill(0),dl=[],t0=new Date();t0.setHours(0,0,0,0);
ok.forEach(o=>{const t=new Date(o.ts),seen={};let sum=0;
o.items.forEach(i=>{if(shop&&i.s!==shop)return;const m=i.p*i.q,c=m*comOf(i.s)/100,a=top[i.t]=top[i.t]||{q:0,m:0},b=bs[i.s]=bs[i.s]||{n:0,q:0,m:0,c:0};sum+=m;K.q+=i.q;K.com+=c;a.q+=i.q;a.m+=m;b.q+=i.q;b.m+=m;b.c+=c;if(!seen[i.s]){seen[i.s]=1;b.n++}});

const di=Math.round((t0-new Date(o.ts).setHours(0,0,0,0))/864e5);if(di>=0&&di<nd)dv[nd-1-di]+=sum});
for(let i=0;i<nd;i++){const d=new Date(t0);d.setDate(d.getDate()-(nd-1-i));dl.push(i%Math.ceil(nd/7)===0?d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0'):'')}

function cfg(k,v){v=k==='com'?Math.min(50,Math.max(0,+v||0)):['dBase','dKm','dMin','dFree'].includes(k)?Math.max(0,+v||0):v.trim();if(k==='name'&&!v)return;CFG[k]=v;save();toast('Сохранено');draw()}
function clearDemo(){O=O.filter(o=>!o.demo);save();toast('Удалено');draw()}
function settingsTab(){const N='type="number" inputmode="decimal" min="0" step="0.5"',f=(k,t,x='')=>`<label class="f">${t}<input ${x} value="${esc(CFG[k])}" onchange="cfg('${k}',this.value)"></label>`;
return `<div class="box"><b>Маркетплейс</b>${f('name','Название')}${f('city','Город')}${f('com','Комиссия с продаж, %','type="number" inputmode="decimal"')}${f('legal','Юр. название / ФИО')}<div class="two">${f('inn','ИНН','inputmode="numeric"')}${f('phone','Телефон','inputmode="tel"')}</div>${f('addr','Адрес')}</div><div class="box"><b>🛵 Доставка и курьеры</b><div class="two">${f('dBase','Подача, сомони',N)}${f('dKm','За 1 км, сомони',N)}</div><div class="two">${f('dMin','Минимум, сомони',N)}${f('dFree','Бесплатно от суммы, сомони',N)}</div><div class="mu">Формула: подача + км × цена за км, но не меньше минимума. 0 в поле «бесплатно» — бесплатной доставки нет.</div><div class="km"><span>1 км → ${rub(fee(1,0))}</span><span>3 км → ${rub(fee(3,0))}</span><span>7 км → ${rub(fee(7,0))}</span></div><div class="mu">Вся сумма доставки идёт курьеру.</div></div><div class="box"><b>Данные</b><div class="mu">Демо-заказы нужны только для примера аналитики.</div><button class="btn sec" onclick="clearDemo()">Удалить демо-заказы</button></div>`}
function geoShop(n){geo(async p=>{const s=shopOf(decodeURIComponent(n));if(!s)return;s.lat=p.lat;s.lng=p.lng;save();toast('Точка магазина сохранена');draw();const a=await revGeo(p);if(a){s.addr=a;save();draw()}})}
function shopSet(k,v,n){const s=shopOf(n?decodeURIComponent(n):U.shop);v=k==='com'?(v===''?null:Math.min(50,Math.max(0,+v||0))):v.trim();s[k]=v;save();toast('Сохранено')}
const legal=(s,n)=>`<label class="f">Юр. название / ФИО<input value="${esc(s.legal||'')}" onchange="shopSet('legal',this.value,'${n}')"></label><div class="two"><label class="f">ИНН<input inputmode="numeric" value="${esc(s.inn||'')}" onchange="shopSet('inn',this.value,'${n}')"></label><label class="f">Телефон<input inputmode="tel" value="${esc(s.phone||'')}" onchange="shopSet('phone',this.value,'${n}')"></label></div><div class="f" style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)">Адрес магазина<div class="geo"><input value="${esc(s.addr||'')}" onchange="shopSet('addr',this.value,'${n}')"><button class="btn sec" onclick="geoShop('${n}')">📍 GPS</button></div></div>${has(s)?gEmb(s):'<div class="demo">Точка на карте не задана — нажмите 📍 GPS, находясь в магазине.</div>'}`;
function shopSettings(s,sel){const e=E(s.name);return `<div class="box">${sel?'':`<label class="f">Название<input value="${esc(s.name)}" onchange="renameShop('${e}',this.value)"></label>`}<label class="f">Описание<input value="${esc(s.d||'')}" onchange="setDesc('${e}',this.value)"></label><label class="f">Фото<input type="file" accept="image/*" onchange="photo(this,decodeURIComponent('${e}'))"></label>${legal(s,e)}${sel?'<div class="mu">Эти данные печатаются на чеке покупателя.</div>':`<label class="f">Комиссия магазина, %<input type="number" inputmode="decimal" placeholder="${CFG.com}" value="${s.com==null?'':s.com}" onchange="shopSet('com',this.value,'${e}')"></label>`}</div>${sel?'':`<div class="two"><button class="btn sec" onclick="resetVotes('${e}')">Сбросить оценки</button>${dbtn('s',s.name)}</div>`}`}
const pform=l=>`<div class="box"><b>Новый товар</b><input id="at" placeholder="Название"><div class="two"><select id="as">${l.map(n=>`<option>${esc(n)}</option>`).join('')}</select><select id="ac">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="two"><input id="ap" type="number" inputmode="numeric" placeholder="Цена"><input id="ak" type="number" inputmode="numeric" placeholder="Остаток"></div><input id="ae" placeholder="Эмодзи (📦)" maxlength="4"><button class="btn" onclick="adminAddP()">Добавить товар</button></div>`;
const prow=x=>`<div class="box"><div class="sp"><b>${x.e} ${esc(x.t)}</b><span class="mu">${esc(x.s)}</span></div><div class="two"><label class="f">Цена<input type="number" inputmode="numeric" value="${x.p}" onchange="setPrice(${x.id},this.value)"></label><label class="f">Остаток<input type="number" inputmode="numeric" value="${x.st}" onchange="setStock(${x.id},this.value)"></label></div>${phEdit(x)}${dbtn('p',x.id)}</div>`;
function adminShop(n,sel){const s=shopOf(n),st=stat(n),a=S.ast,np=P.filter(x=>x.s===n).length,no=O.filter(o=>o.items.some(i=>i.s===n)).length,T=[['an','Аналитика'],['items','Товары ('+np+')'],['orders','Заказы ('+no+')'],['set',sel?'Витрина':'Настройки'],['rev','Отзывы']];let b='';
if(a==='an')b=ana(n);
else if(a==='items')b=pform([n])+(P.filter(x=>x.s===n).map(prow).join('')||'<p class="mu">В магазине пока нет товаров.</p>');
else if(a==='orders')b=O.filter(o=>o.items.some(i=>i.s===n)).map(o=>`<div class="box"><div class="sp"><b>Заказ №${o.id}</b><button class="chip" onclick="openR(${o.id})">🧾 Чек</button><span class="${stc(o.st)}">${o.st}</span></div><div class="mu">${esc(o.bn)} · ${esc(fmtP(o.b))} · ${o.d} · ${esc(o.addr)}</div>${tline(o)}${o.crn?`<div class="mu">🛵 Курьер: ${esc(o.crn)}</div>`:''}${o.items.filter(i=>i.s===n).map(i=>`<div class="sp"><span>${esc(i.t)} × ${i.q}</span><span>${rub(i.p*i.q)}</span></div>`).join('')}</div>`).join('')||'<p class="mu">Заказов нет.</p>';
else if(a==='set')b=shopSettings(s,sel);
else b=RV.map((r,i)=>r.s===n?`<div class="box"><div class="sp"><b>${esc(r.n)}</b><span class="mu">${r.d}</span></div><div>${esc(r.t)}</div>${sel?'':dbtn('r',i)}</div>`:'').join('')||'<p class="mu">Отзывов пока нет. Напишите первый.</p>';
return `${sel?'':'<button class="lnk" onclick="S.as=null;draw()">← Все магазины</button>'}<div class="sp"><h1 style="margin:0">${s.e||'🏪'} ${esc(n)}</h1><span class="badge">${st.n?'★ '+st.r.toFixed(1):'Нет оценок'}</span></div><div class="chips" style="margin:10px 0">${T.map(t=>`<button class="chip ${a===t[0]?'on':''}" onclick="S.ast='${t[0]}';S.cf=null;draw()">${t[1]}</button>`).join('')}</div>${b}`}
function openR(id){S.rid=id;go('receipt')}
function receipt(){
const o=O.find(x=>x.id==S.rid);
if(!o||!U||!(U.role==='admin'||o.b===U.email||(U.shop&&o.items.some(i=>i.s===U.shop))))return '<h1>Чек</h1><p class="mu">Чек недоступен.</p>';
const by={};o.items.forEach(i=>(by[i.s]=by[i.s]||[]).push(i));
const dt=new Date(o.ts),code='ЧК-'+dt.getFullYear()+'-'+String(o.id).padStart(6,'0');
QRT=[CFG.name,code,dt.toISOString().slice(0,16),(o.total+(o.fee||0))+' TJS',...Object.keys(by).map(n=>n+':'+((shopOf(n)||{}).inn||'-'))].join('|');
return `<div class="noprint sp"><button class="lnk" onclick="go(S.prev||'orders')">← Назад</button><button class="btn" onclick="try{print()}catch(e){}">Печать</button></div>
<div class="rc"><div class="ctr"><b>${esc(CFG.name)}</b><br>${esc(CFG.city)}${CFG.legal?'<br>'+esc(CFG.legal):''}${CFG.inn?'<br>ИНН: '+esc(CFG.inn):''}</div><hr>
<b>Чек ${code}</b><div class="sp"><span>${dt.toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})}</span><span>Заказ №${o.id}</span></div><div>Покупатель: ${esc(o.bn)}</div><div>Адрес: ${esc(o.addr)}</div><div>Оплата: ${o.pay==='card'?'Картой при получении':'Наличными при получении'}</div><hr>
${Object.keys(by).map(n=>{const s=shopOf(n)||{},sum=by[n].reduce((a,i)=>a+i.p*i.q,0);return `<div><b>Продавец: ${esc(s.legal||n)}</b></div><div class="rs">${esc(n)}${s.inn?' · ИНН: '+esc(s.inn):''}${s.phone?' · '+esc(s.phone):''}</div>${by[n].map(i=>`<div class="sp"><span>${esc(i.t)} × ${i.q}</span><span>${rub(i.p*i.q)}</span></div>`).join('')}<div class="sp rs"><span>Итого продавцу</span><span>${rub(sum)}</span></div>`}).join('<hr>')}<hr>
<div class="sp"><span>Доставка${o.km!=null?' · '+(+o.km).toFixed(1)+' км':''}${o.crn?' · '+esc(o.crn):''}</span><span>${rub(o.fee||0)}</span></div><div class="sp"><b>ИТОГО</b><b>${rub(o.total+(o.fee||0))}</b></div><div id="qr" class="qr"></div><div class="ctr rs">Это товарный чек-подтверждение заказа. Фискальный чек выдаёт продавец в соответствии с законодательством.</div></div>`}
function terms(){return `<h1>Условия и политика</h1><p class="mu">Шаблон. Перед запуском проверьте текст у юриста по законодательству Таджикистана.</p>
<div class="box"><b>Условия использования</b><p>Продавцы отвечают за товары, цены и описания. Маркетплейс связывает покупателя и продавца и не заменяет документы продавца.</p></div>
<div class="box"><b>Конфиденциальность</b><p>Мы храним имя, номер телефона и адрес доставки только для выполнения заказа. Данные не передаются третьим лицам без согласия покупателя, кроме случаев, предусмотренных законом.</p></div>
<div class="box"><b>Возврат и обмен</b><p>Покупатель вправе вернуть товар надлежащего качества в срок, установленный законом. Для возврата свяжитесь с продавцом, его телефон указан на чеке.</p></div>
<div class="box"><b>Контакты</b><p>${esc(CFG.name)}, ${esc(CFG.city)}${CFG.phone?', '+esc(CFG.phone):''}</p></div>`}
function boot(){
if(U){const f=USERS.find(x=>x.email===U.email);if(f)U=f}
if(store.get('cur',0)!==1){const f=p=>Math.max(1,p>300?Math.round(p*.12/5)*5:Math.round(p*.12));P.forEach(x=>x.p=f(x.p));O.forEach(o=>{o.items.forEach(i=>i.p=f(i.p));o.total=o.items.reduce((a,i)=>a+i.p*i.q,0)});store.set('cur',1)}
O.forEach(o=>{if(!o.ts)o.ts=Date.now()-2*864e5;if(!o.pay)o.pay='cash'});
if(!store.get('demo',0)&&P.length){let s=7;const r=()=>(s=s*16807%2147483647)/2147483647,H=[10,11,12,13,14,17,18,19,20,21];
for(let k=0;k<70;k++){const d=new Date();d.setDate(d.getDate()-Math.floor(r()*30));d.setHours(H[Math.floor(r()*10)],Math.floor(r()*60),0,0);const it=[];for(let j=1+Math.floor(r()*3);j>0;j--){const x=P[Math.floor(r()*P.length)];if(!it.some(i=>i.id===x.id))it.push({id:x.id,t:x.t,p:x.p,q:1+Math.floor(r()*2),s:x.s})}
O.push({id:2000+k,b:'client@demo',bn:'Клиент',items:it,total:it.reduce((a,i)=>a+i.p*i.q,0),addr:'Исфара, ул. Ленина, 10',st:r()<.1?'Отменён':'Доставлен',pay:r()<.5?'card':'cash',d:d.toLocaleDateString('ru-RU'),ts:d.getTime(),demo:1})}
O.sort((a,b)=>b.ts-a.ts);store.set('demo',1)}
const MS={'Новый':ST[0],'Собран':ST[1],'В пути':ST[2]};O.forEach(o=>{if(MS[o.st])o.st=MS[o.st];if(o.fee==null){if(o.demo&&o.st===ST[3]){o.km=+(1+((o.id*37)%60)/10).toFixed(1);o.fee=fee(o.km,0);o.cr='courier@demo';o.crn='Фаррух'}else o.fee=0}if(!o.hist)o.hist=[{st:o.st,ts:o.ts}]});
const OF=[[.0021,-.0034],[-.0043,.0018],[.0035,.0052],[-.0012,-.0061],[.0058,.0009],[-.0049,-.0041]];SH.forEach((s,i)=>{if(s.lat==null){const f=OF[i%6];s.lat=GC.lat+f[0];s.lng=GC.lng+f[1];s.addr=s.addr||'Исфара, центр города'}});
if(!store.get('crseed',0)){if(!USERS.some(u=>u.email==='courier@demo'))USERS.push({email:'courier@demo',name:'Фаррух',role:'courier'});store.set('crseed',1)}
save()}
function out(){U=null;save();go('home')}
boot();route();
</script></body></html>
